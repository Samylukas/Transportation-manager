<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samy Fleet Pro - إدارة التنقلات</title>
    <style>
        :root { --primary: #1e3c72; --secondary: #2a5298; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--secondary); padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: var(--secondary); }
        .loader { display: none; text-align: center; color: var(--primary); font-weight: bold; margin-top: 10px; }
        .success-msg { display: none; background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>إضافة رحلة جديدة</h1>
    
    <div id="loader" class="loader">جاري الاتصال بقاعدة البيانات... ⏳</div>
    <div id="successMsg" class="success-msg">✅ تم تسجيل الرحلة بنجاح!</div>

    <form id="tripForm">
        <div class="form-group">
            <label>اسم العميل</label>
            <select id="client_name" required>
                <option value="">اختر العميل...</option>
            </select>
        </div>

        <div class="form-group">
            <label>اسم السائق</label>
            <select id="driver_name" required>
                <option value="">اختر السائق...</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع الرحلة (خط السير)</label>
            <select id="trip_name" required>
                <option value="">اختر خط السير...</option>
            </select>
        </div>

        <div class="form-group">
            <label>نوع السيارة</label>
            <select id="vehicle_type" required>
                <option value="Limousine">ليموزين (Limousine)</option>
                <option value="Microbus">ميكروباص (Microbus)</option>
                <option value="Coaster">كوستر (Coaster)</option>
                <option value="Bus">أتوبيس (Bus)</option>
            </select>
        </div>

        <div class="form-group">
            <label>الإيراد (Revenue)</label>
            <input type="number" id="revenue" required placeholder="مثال: 1600">
        </div>

        <div class="form-group">
            <label>أجرة السائق (Driver Fee)</label>
            <input type="number" id="driver_fee" required placeholder="مثال: 1200">
        </div>

        <div class="form-group">
            <label>ملاحظات إضافية</label>
            <textarea id="notes" rows="2" placeholder="أي تفاصيل أخرى..."></textarea>
        </div>

        <button type="submit" id="submitBtn">تسجيل الرحلة</button>
    </form>
</div>

<script>
    // الرابط الجديد الخاص بجوجل شيت الذي قمنا بإنشائه
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQZp6Hx1GuGqqPZlhgfY0TiioihvR34rGMpDSIOUMv1rft37aBxH5_JJp0NhVtl5wYHg/exec";

    // دالة لتحميل البيانات الأولية (العملاء، السائقين، الرحلات) عند فتح الصفحة
    async function fetchInitialData() {
        document.getElementById("loader").style.display = "block";
        try {
            const response = await fetch(SCRIPT_URL + "?action=getInitialData");
            const data = await response.json();
            
            if(data.status === "success") {
                populateSelect("client_name", data.clients);
                populateSelect("driver_name", data.drivers.map(d => d.name));
                populateSelect("trip_name", data.trips.map(t => t.name));
            }
        } catch (error) {
            console.error("Error fetching data:", error);
            alert("حدث خطأ أثناء جلب البيانات من جوجل شيت.");
        } finally {
            document.getElementById("loader").style.display = "none";
        }
    }

    // دالة مساعدة لملء القوائم المنسدلة
    function populateSelect(elementId, items) {
        const select = document.getElementById(elementId);
        items.forEach(item => {
            const option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            select.appendChild(option);
        });
    }

    // إرسال البيانات عند الضغط على زر التسجيل
    document.getElementById("tripForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.textContent = "جاري الحفظ... ⏳";

        // تجميع البيانات
        const payload = {
            record_type: "trip",
            client_name: document.getElementById("client_name").value,
            driver_name: document.getElementById("driver_name").value,
            trip_name: document.getElementById("trip_name").value,
            vehicle_type: document.getElementById("vehicle_type").value,
            revenue: document.getElementById("revenue").value,
            driver_fee: document.getElementById("driver_fee").value,
            notes: document.getElementById("notes").value
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            if(result.status === "success") {
                document.getElementById("successMsg").style.display = "block";
                document.getElementById("tripForm").reset(); // تفريغ الخانات
                setTimeout(() => { document.getElementById("successMsg").style.display = "none"; }, 4000);
            } else {
                alert("خطأ: " + result.message);
            }
        } catch (error) {
            console.error("Error posting data:", error);
            alert("فشل الاتصال بقاعدة البيانات.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "تسجيل الرحلة";
        }
    });

    // تشغيل دالة جلب البيانات عند فتح الموقع
    window.onload = fetchInitialData;
</script>

</body>
</html>
